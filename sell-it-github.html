<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b8f72"><title>Sell It</title><style>body{margin:0;background:#f4f7f6;color:#14201d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:620px;margin:auto;padding:28px 18px}h1{font-size:42px;margin:8px 0}.sub{color:#61706c}.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0000000d}label{font-weight:700;display:block;margin:10px 0 5px}input,select,button{width:100%;padding:16px;border-radius:14px;font-size:17px;box-sizing:border-box}input,select{border:1px solid #d7dfdc;background:#fff}button{border:0;background:#0b8f72;color:#fff;font-weight:800;margin-top:14px}#status{min-height:22px;color:#61706c}#result{display:none}.score{font-size:56px;font-weight:900;color:#0b8f72}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f0f4f2;border-radius:14px;padding:14px}.metric span{display:block;color:#61706c;font-size:12px;font-weight:700}.metric b{display:block;font-size:21px;margin-top:5px}.small{font-size:13px;color:#6b7774}.listing{line-height:1.55}</style></head><body><main><h1>Sell It</h1><p class="sub">Find out what your unwanted stuff could actually make.</p><section class="card"><label>What are you selling?</label><input id="item" placeholder="e.g. iPhone 13, LEGO set, watch"><label>Condition</label><select id="condition"><option value="new">New</option><option value="good" selected>Good</option><option value="fair">Fair</option><option value="poor">Poor</option></select><button id="analyse">Analyse my item</button><p id="status"></p></section><section id="result"><div class="card"><div class="small">SELL IT SCORE</div><div class="score" id="score">—</div><h2 id="verdict"></h2><p id="reason"></p></div><div class="card"><div class="grid"><div class="metric"><span>ESTIMATED RANGE</span><b id="range"></b></div><div class="metric"><span>SUGGESTED PRICE</span><b id="price"></b></div><div class="metric"><span>POSTAGE</span><b id="postage"></b></div><div class="metric"><span>ESTIMATED TAKE-HOME</span><b id="takehome"></b></div></div></div><div class="card"><h3>Ready-to-use listing</h3><p class="listing" id="listing"></p></div><div class="card"><p class="small">Prototype estimate only. Prices are illustrative and are not completed-sale evidence.</p></div></section></main><script>(function(){const data={"iphone 13":[180,235,300,62,7.2],"iphone":[120,180,240,48,6.5],"lego":[25,55,90,35,5.5],"watch":[35,80,160,29,5],"ps5":[280,340,420,41,9.5],"airpods":[45,80,130,53,5],"ipad":[100,180,280,38,7.2],"macbook":[250,450,700,31,8.5],"samsung":[100,180,300,34,6.5]};const mult={new:1.08,good:1,fair:.82,poor:.65},pts={new:15,good:12,fair:8,poor:5};document.getElementById("analyse").onclick=function(){const name=document.getElementById("item").value.trim(),c=document.getElementById("condition").value,s=document.getElementById("status"),r=document.getElementById("result");if(!name){s.textContent="Please enter an item first.";r.style.display="none";return}const key=Object.keys(data).sort((a,b)=>b.length-a.length).find(k=>name.toLowerCase().includes(k)),d=data[key]||[15,40,80,12,5.5],m=mult[c],lo=Math.round(d[0]*m),mid=Math.round(d[1]*m),hi=Math.round(d[2]*m),post=Math.max(4.99,d[4]),score=Math.min(100,Math.round(20+Math.min(35,Math.log10(d[3])*12)+Math.min(25,mid/hi*25)+pts[c]));let v,reason;if(score>=75){v="Strong selling opportunity";reason="The estimated return makes this worth considering."}else if(score>=55){v="Worth listing";reason="The estimated return makes listing it worth considering."}else if(score>=35){v="Sell if the effort is worthwhile";reason="Consider the time involved compared with the estimated return."}else{v="Consider local collection or donation";reason="The estimated return may not justify postage and listing effort."}document.getElementById("score").textContent=score+"/100";document.getElementById("verdict").textContent=v;document.getElementById("reason").textContent=reason;document.getElementById("range").textContent="£"+lo+"–£"+hi;document.getElementById("price").textContent="£"+mid;document.getElementById("postage").textContent="£"+post.toFixed(2);document.getElementById("takehome").textContent="£"+Math.max(0,mid-post).toFixed(2);document.getElementById("listing").textContent="Selling a "+name+" in "+c+" condition. Please see the photos for exact condition and what is included. Sensible offers considered.";r.style.display="block";s.textContent="Analysis complete.";r.scrollIntoView({behavior:"smooth"})}})();</script></body></html>
